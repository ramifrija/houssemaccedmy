<?xml version="1.0" encoding="UTF-8"?>
<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <!-- Définitions des gradients -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Fond principal avec dégradé -->
  <rect width="1080" height="1920" fill="url(#bgGradient)"/>
  
  <!-- Motifs décoratifs -->
  <g opacity="0.1">
    <circle cx="200" cy="300" r="60" fill="#ffffff"/>
    <circle cx="880" cy="400" r="40" fill="#ffffff"/>
    <circle cx="150" cy="1500" r="80" fill="#ffffff"/>
    <circle cx="930" cy="1600" r="50" fill="#ffffff"/>
  </g>
  
  <!-- Logo principal centré -->
  <g transform="translate(540, 800)" filter="url(#shadow)">
    <!-- Fond du logo -->
    <rect x="-100" y="-100" width="200" height="200" rx="30" fill="url(#logoGradient)" opacity="0.95"/>
    
    <!-- Logo "H" -->
    <g transform="translate(0, 0)">
      <!-- Barre gauche -->
      <rect x="-40" y="-60" width="20" height="120" rx="10" fill="#2563eb"/>
      <!-- Barre droite -->
      <rect x="20" y="-60" width="20" height="120" rx="10" fill="#2563eb"/>
      <!-- Barre horizontale -->
      <rect x="-40" y="-10" width="80" height="20" rx="10" fill="#2563eb"/>
    </g>
    
    <!-- Élément décoratif - livre -->
    <g transform="translate(0, -30)" opacity="0.8">
      <rect x="-15" y="-20" width="10" height="40" rx="5" fill="#f59e0b"/>
      <rect x="5" y="-20" width="10" height="40" rx="5" fill="#f59e0b"/>
      <rect x="-5" y="-20" width="10" height="40" rx="5" fill="#ffffff"/>
    </g>
  </g>
  
  <!-- Texte principal -->
  <g transform="translate(540, 1100)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" 
          font-size="48" font-weight="bold" fill="#ffffff" filter="url(#shadow)">
      Houssem Academy
    </text>
    
    <text x="0" y="60" text-anchor="middle" font-family="Arial, sans-serif" 
          font-size="24" font-weight="normal" fill="#ffffff" opacity="0.8">
      Gestion Académique Moderne
    </text>
  </g>
  
  <!-- Indicateur de chargement -->
  <g transform="translate(540, 1400)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.3"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#f59e0b" stroke-width="4" 
            stroke-dasharray="188" stroke-dashoffset="47" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" 
                       values="0 0 0;360 0 0" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Version -->
  <g transform="translate(540, 1800)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" 
          font-size="16" font-weight="normal" fill="#ffffff" opacity="0.6">
      Version 1.0.0
    </text>
  </g>
</svg>































