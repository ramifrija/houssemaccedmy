<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond avec dégradé -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond principal -->
  <rect width="1024" height="1024" rx="200" fill="url(#bgGradient)"/>
  
  <!-- Élément décoratif - livre ouvert -->
  <g transform="translate(512, 300)">
    <!-- Page gauche -->
    <rect x="-120" y="-80" width="80" height="160" rx="10" fill="#ffffff" opacity="0.9"/>
    <!-- Page droite -->
    <rect x="40" y="-80" width="80" height="160" rx="10" fill="#ffffff" opacity="0.9"/>
    <!-- Reliure -->
    <rect x="-40" y="-80" width="80" height="160" rx="10" fill="url(#accentGradient)"/>
    <!-- Lignes de texte -->
    <line x1="-100" y1="-40" x2="-60" y2="-40" stroke="#e5e7eb" stroke-width="3"/>
    <line x1="-100" y1="-20" x2="-80" y2="-20" stroke="#e5e7eb" stroke-width="3"/>
    <line x1="60" y1="-40" x2="100" y2="-40" stroke="#e5e7eb" stroke-width="3"/>
    <line x1="60" y1="-20" x2="80" y2="-20" stroke="#e5e7eb" stroke-width="3"/>
  </g>
  
  <!-- Logo "H" principal -->
  <g transform="translate(512, 650)">
    <!-- Barre gauche -->
    <rect x="-60" y="-120" width="40" height="240" rx="20" fill="#ffffff"/>
    <!-- Barre droite -->
    <rect x="20" y="-120" width="40" height="240" rx="20" fill="#ffffff"/>
    <!-- Barre horizontale -->
    <rect x="-60" y="-20" width="120" height="40" rx="20" fill="#ffffff"/>
  </g>
  
  <!-- Élément décoratif - graduation cap -->
  <g transform="translate(512, 200)">
    <!-- Forme du chapeau -->
    <path d="M-80,-40 L0,-80 L80,-40 L60,0 L-60,0 Z" fill="url(#accentGradient)" opacity="0.8"/>
    <!-- Pompon -->
    <circle cx="0" cy="-80" r="15" fill="#ffffff"/>
  </g>
  
  <!-- Points décoratifs -->
  <circle cx="200" cy="200" r="8" fill="#ffffff" opacity="0.6"/>
  <circle cx="824" cy="200" r="8" fill="#ffffff" opacity="0.6"/>
  <circle cx="200" cy="824" r="8" fill="#ffffff" opacity="0.6"/>
  <circle cx="824" cy="824" r="8" fill="#ffffff" opacity="0.6"/>
</svg>































